{% extends 'base.html' %}{% block title %}POS / Billing{% endblock %}{% block content %}<div class=pos><section class=pos-products><div class=searchbar><input id=search placeholder='Scan barcode or search product…' autofocus><button onclick=searchProducts()><i class='fa-solid fa-barcode'></i></button></div><div id=results class=results></div></section><section class=cart panel><div class=panel-head><h3>Current cart</h3><button class=small onclick='cart=[];render()'>Clear</button></div><div id=cartRows></div><div class=checkout><label>Customer<select id=customer><option value=''>Walk-in customer</option>{% for c in customers %}<option value={{c.id}}>{{c.name}} · {{c.phone or ''}}</option>{% endfor %}</select></label><label>Discount (₹)<input id=discount type=number step=.01 value=0 min=0></label><label>Payment<select id=payment><option>Cash</option><option>UPI</option><option>Card</option></select></label><div class=totals><div>Subtotal <b id=subtotal>₹0.00</b></div><div>Discount <b id=discountOut>₹0.00</b></div><div>GST <b id=gst>₹0.00</b></div><strong>Grand total <b id=grand>₹0.00</b></strong></div><button class='primary wide' onclick=checkout()>Complete sale <i class='fa-solid fa-arrow-right'></i></button></div></section></div>{% endblock %}{% block scripts %}<script>let cart=[];const search=document.getElementById('search');async function searchProducts(){let q=search.value.trim();if(!q)return;let r=await fetch('/api/products?q='+encodeURIComponent(q));let ps=await r.json();results.innerHTML=ps.map(p=>`<button class=result onclick='add(${JSON.stringify(p)})'><b>${p.name}</b><span>₹${p.price.toFixed(2)} · ${p.stock} ${p.unit}</span></button>`).join('')||'<div class=empty>No matching in-stock products</div>'}search.onkeydown=e=>{if(e.key==='Enter')searchProducts()};function add(p){let x=cart.find(i=>i.id===p.id);if(x)x.quantity++;else cart.push({...p,quantity:1});render();search.value='';results.innerHTML=''}function render(){cartRows.innerHTML=cart.map((p,i)=>`<div class=cartrow><div><b>${p.name}</b><small>₹${p.price.toFixed(2)} · GST ${p.gst}%</small></div><input type=number min=1 max=${p.stock} step=.001 value=${p.quantity} onchange='setQty(${i},this.value)'><b>₹${(p.price*p.quantity).toFixed(2)}</b><button onclick='cart.splice(${i},1);render()'>×</button></div>`).join('')||'<div class=empty>Scan or search products to begin</div>';let sub=cart.reduce((s,p)=>s+p.price*p.quantity,0),dis=Math.min(Math.max(+discount.value||0,0),sub),tax=cart.reduce((s,p)=>s+(p.price*p.quantity)*(p.gst/100),0)*(sub?Math.max(0,(sub-dis)/sub):0);subtotal.textContent='₹'+sub.toFixed(2);discountOut.textContent='₹'+dis.toFixed(2);gst.textContent='₹'+tax.toFixed(2);grand.textContent='₹'+(sub-dis+tax).toFixed(2)}function setQty(i,v){let n=Math.max(1,Math.min(+v,cart[i].stock));cart[i].quantity=n;render()}discount.oninput=render;async function checkout(){if(!cart.length)return alert('Cart is empty');let r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(p=>({id:p.id,quantity:p.quantity})),customer_id:customer.value||null,discount:+discount.value||0,payment_method:payment.value})});let d=await r.json();if(!r.ok)return alert(d.error);location.href='/invoice/'+d.bill_id}render();</script>{% endblock %}
